name: Publish (tag-based version)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  publish:
    # run only if:
    # - CI succeeded
    # - it was a push to develop (merge)
    if: >
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'develop'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to push
      packages: write

    steps:
      - name: Checkout tested commit (with tags)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }} # ✅ ВАЖНО: именно проверенный SHA
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry + dynamic versioning plugin
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          # ✅ ВАЖНО: подключаем как Poetry plugin
          poetry self add "poetry-dynamic-versioning[plugin]"

      - name: Install deps
        run: poetry install --no-interaction

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Create next tag (patch bump)
        id: ver
        shell: bash
        run: |
          set -euo pipefail

          # Если HEAD уже помечен semver-тегом — НЕ bump'аем (релизный тег руками)
          existing="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [[ -n "$existing" ]]; then
            echo "tag=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_tag="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 || true)"
          if [[ -z "$last_tag" ]]; then
            new_version="0.1.0"
          else
            v="${last_tag#v}"
            IFS='.' read -r major minor patch <<< "$v"
            patch=$((patch + 1))
            new_version="${major}.${minor}.${patch}"
          fi

          tag="v${new_version}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists"
          else
            git tag "$tag"
            git push origin "$tag"
          fi
