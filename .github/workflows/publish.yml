      #   run: |
      #     git fetch --force --tags

      #     latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
      #     if [ -z "$latest_tag" ]; then
      #       base="$(poetry version -s)"   # fallback to pyproject version (e.g. 0.1.0)
      #     else
      #       base="${latest_tag#v}"
      #     fi

      #     IFS='.' read -r major minor patch <<< "$base"
      #     patch=$((patch + 1))
      #     new_version="${major}.${minor}.${patch}"

      #     echo "Latest tag: ${latest_tag:-<none>}"
      #     echo "Setting version to: $new_version"

      #     poetry version "$new_version"

      #     new_tag="v${new_version}"
      #     git tag "$new_tag"
      #     git push origin "$new_tag"
      - name: Configure GitHub Packages (PyPI registry)
        run: |
          poetry config repositories.github "https://pip.pkg.github.com/behemothi"
          poetry config http-basic.github "__token__" "${{ secrets.GITHUB_TOKEN }}"

      - name: Build
        run: poetry build -vv

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

      - name: Publish
        run: poetry publish -r github
