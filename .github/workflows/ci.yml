name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install deps
        run: poetry install --no-interaction

      - name: Unit tests (PR + push)
        run: poetry run pytest -m "unit"

  integration:
    # ✅ integration only after merge to develop (push)
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install deps
        run: poetry install --no-interaction

      - name: Integration tests (push only)
        run: poetry run pytest -m "integration"
